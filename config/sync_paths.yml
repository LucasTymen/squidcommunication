# 🔄 Synchronisation bilatérale SquidCommunication <-> SquidResearch

schema_version: "1.0"
last_updated: "2025-11-13T16:00:00Z"

sources:
  research_repo:
    root: "/home/lucas/tools/squidResearch"
    log_file: "communication_projet.md"
    campaigns_root: "data/communication"
    scripts: "scripts"
  communication_repo:
    root: "/home/lucas/tools/squidCommunication"
    log_file: "communication_log.md"
    campaigns_root: "campaigns"
    scripts: "scripts"

sync_rules:
  - name: logs
    description: "Synchronise les journaux de communication"
    from: "research_repo/log_file"
    to: "communication_repo/log_file"
    direction: "bidirectional"
    strategy: "timestamp-precedence"
  - name: campaign_templates
    description: "Copie les modèles de campagne depuis squidCommunication vers squidResearch"
    from: "communication_repo/templates"
    to: "research_repo/data/communication/templates"
    direction: "one_way"
    strategy: "mirror"
  - name: analytics_reports
    description: "Retourne les analytics consolidées vers squidResearch"
    from: "communication_repo/campaigns/*/archive"
    to: "research_repo/data/communication/analytics"
    direction: "one_way"
    strategy: "append"

credentials:
  prompt: true  # toujours demander confirmation avant de pousser des données sensibles

