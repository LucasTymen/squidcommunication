<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SquidResearch — Épisode 1 (Slide 1)</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at 20% 20%, rgba(90, 217, 255, 0.28), transparent 45%),
                  radial-gradient(circle at 80% 0%, rgba(132, 94, 247, 0.35), transparent 40%),
                  linear-gradient(135deg, #090817 0%, #1c0f39 45%, #2f1b63 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px;
      box-sizing: border-box;
    }
    .card {
      width: 1080px;
      height: 1080px;
      border-radius: 48px;
      padding: 120px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 40px 90px -30px rgba(17, 24, 39, 0.7);
    }
    .badge {
      align-self: flex-start;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.85), rgba(14, 165, 233, 0.75));
      color: #0b1120;
      font-weight: 600;
    }
    h1 {
      font-size: 96px;
      line-height: 1.05;
      margin: 0;
    }
    h2 {
      font-size: 48px;
      font-weight: 500;
      margin: 24px 0 0;
      color: rgba(226, 232, 240, 0.9);
    }
    p {
      font-size: 36px;
      line-height: 1.5;
      color: rgba(203, 213, 225, 0.92);
      margin: 40px 0 0;
    }
    .footer {
      font-size: 28px;
      color: rgba(148, 163, 184, 0.85);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Épisode 1</div>
    <div>
      <h1>🦑 SquidResearch</h1>
      <h2>Pourquoi j’ai décidé d’automatiser ma recherche d’emploi</h2>
      <p>Un outil personnel pour gagner du temps, rester organisé et analyser mes candidatures sans perdre mon énergie.</p>
    </div>
    <div class="footer">Saga data-driven · Style BOGOSS</div>
  </div>
</body>
</html>
